require:
  - ./.rubocop/cops/html2rss/no_metaprogramming.rb
  - ./.rubocop/cops/html2rss/local_error_class.rb
  - ./.rubocop/cops/html2rss/no_console_output.rb

plugins:
  - rubocop-performance
  - rubocop-rspec
  - rubocop-md
  - rubocop-rake
  - rubocop-thread_safety
  - rubocop-yard

AllCops:
  DisplayCopNames: true
  NewCops: enable
  TargetRubyVersion: 3.3
  ParserEngine: parser_prism
  Exclude:
    - vendor/**/*
    - spec/fixtures/**/*.{yml,yaml}
    - tmp/**/*
    - target/**/*

Metrics/BlockLength:
  Exclude:
    - "spec/**/*_spec.rb"
    - html2rss.gemspec

RSpec/NestedGroups:
  Exclude:
    - spec/lib/html2rss_spec.rb

RSpec/DescribeClass:
  Exclude:
    - spec/exe/**/*_spec.rb
    - spec/examples/**/*_spec.rb

RSpec/NamedSubject:
  Enabled: false

Style/HashSyntax:
  EnforcedShorthandSyntax: always

Naming/RescuedExceptionsVariableName:
  PreferredName: error

Layout/ClassStructure:
  Enabled: true
  ExpectedOrder:
    - module_inclusion
    - constants
    - public_class_methods
    - initializer
    - public_methods
    - protected_methods
    - private_methods

Html2rss/NoMetaprogramming:
  Include:
    - 'lib/**/*.rb'

Html2rss/LocalErrorClass:
  Include:
    - 'lib/**/*.rb'

# The CLI (Thor commands and their renderers) owns user-facing stdout/stderr.
Html2rss/NoConsoleOutput:
  Include:
    - 'lib/**/*.rb'
  Exclude:
    - 'lib/html2rss/cli.rb'
    - 'lib/html2rss/cli/**/*.rb'
