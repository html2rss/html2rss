# Reek configuration for html2rss
# See https://github.com/troessner/reek for more information

detectors:
  IrresponsibleModule:
    enabled: false
  UtilityFunction:
    enabled: false
  NilCheck:
    enabled: false
  FeatureEnvy:
    enabled: false
  DuplicateMethodCall:
    enabled: false
  MissingSafeMethod:
    enabled: false
  UncommunicativeVariableName:
    enabled: false
  ControlParameter:
    enabled: false
  DataClump:
    enabled: false
  # A flag stays where it is a public option, forwarded from one, or a parsed or Data value.
  BooleanParameter:
    exclude:
      - Html2rss#self.inspect
      - Html2rss#self.schema_json
      - Html2rss#self.test
      - Html2rss::PageRecon::Diagnostics#self.call
      - Html2rss::Config::Schema#self.json_schema_json
      - Html2rss::Test::Options#self.build
      - Html2rss::Test::Quality#self.report_for
      - Html2rss::Capture::Options#initialize
      - Html2rss::LinkDestination::PathClassifier#initialize
      - Html2rss::LinkDestination::TextClassifier#initialize
      - Html2rss::LinkDestination::NoisePolicy#noise_anchor?
      - Html2rss::Html::ArticleRules::Description#keep?
      - Html2rss::Selectors::OptionSpec#initialize
      - Html2rss::Selectors#each_enhance_pair
      - Html2rss::SST::Document#self.build
      - Html2rss::SST::Normalizer#call
      - Html2rss::Url#self.resolve_web
  InstanceVariableAssumption:
    enabled: false
  RepeatedConditional:
    enabled: false
  UncommunicativeModuleName:
    enabled: false
  UnusedParameters:
    enabled: false
  LongParameterList:
    enabled: false
  NestedIterators:
    max_allowed_nesting: 2
  TooManyStatements:
    max_statements: 25
  TooManyInstanceVariables:
    max_instance_variables: 10
  TooManyMethods:
    max_methods: 30
  TooManyConstants:
    max_constants: 12

exclude_paths:
  - spec/
  - vendor/
  - tmp/
  - coverage/
