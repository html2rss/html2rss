[package]
name = "html2rss_parser"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# cdylib for Ruby; rlib so criterion benches can link pure sst/parse paths.
crate-type = ["cdylib", "rlib"]

[features]
default = ["ruby"]
# Magnus Ruby bindings. Benches use `--no-default-features` to avoid linking libruby.
ruby = ["dep:magnus"]

[dependencies]
magnus = { version = "0.8", optional = true }
scraper = "0.23"
ego-tree = "0.10"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "normalize"
harness = false
