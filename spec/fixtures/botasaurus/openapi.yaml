          examples:
          - 200
        headers:
          additionalProperties:
            type: string
          type: object
          title: Headers
          description: Allowlisted response headers. Only `content-type` is kept.
          examples:
          - content-type: application/json
        body:
          type: string
          title: Body
          description: Raw JSON response body as UTF-8 text.
          examples:
          - '{"items":[]}'
      type: object
      required:
      - url
      - status_code
      - body
      title: XhrResponse
tags:
- name: health
  description: Liveness probe and detected Botasaurus package version.
- name: scrape
  description: Render a public URL and return UTF-8 HTML plus diagnostics.
