          default: false
          examples:
          - false
        block_images:
          type: boolean
          title: Block Images
          description: Ask the driver to skip image downloads.
          default: true
          examples:
          - true
        block_images_and_css:
          type: boolean
          title: Block Images And Css
          description: Ask the driver to skip image and CSS downloads.
          default: false
          examples:
          - false
        block_trackers:
          type: boolean
          title: Block Trackers
          description: Block tracking/ad networks and web fonts to speed up rendering.
          default: true
          examples:
          - true
        wait_for_complete_page_load:
          type: boolean
