          description: Wait for the driver complete-page-load signal before capture.
          default: true
          examples:
          - true
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
          title: User Agent
          description: Explicit User-Agent. Overrides a User-Agent header when both
            are set.
          examples:
          - Mozilla/5.0 (compatible; html2rss)
        headers:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Headers
          description: Extra HTTP headers forwarded to the request client or browser
            session.
          examples:
          - Accept-Language: en-US,en;q=0.9
        cookies:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Cookies
          description: Cookie name/value map forwarded to the request client or browser
            session.
          examples:
          - session: abc123
        window_size:
          anyOf:
          - $ref: '#/components/schemas/WindowSize'
          - type: 'null'
          description: Browser viewport size passed to the driver.
          examples:
          - height: 1080
            width: 1920
        lang:
          anyOf:
          - type: string
          - type: 'null'
          title: Lang
          description: Browser language passed to the driver.
          examples:
          - en-US
        headless:
          type: boolean
          title: Headless
          description: Run Chromium headless. Default false uses a virtual display
            in Docker.
          default: false
          examples:
          - false
        proxy:
          anyOf:
          - type: string
          - type: 'null'
          title: Proxy
          description: Proxy URL passed to the driver. Invalid or blocked proxy URLs
            are rejected by SSRF guardrails.
          examples:
          - http://user:pass@proxy.example:8080
      type: object
      required:
      - url
      title: ScrapeRequest
      examples:
      - url: https://example.com
      - block_images: true
        block_images_and_css: false
        block_trackers: true
        cookies:
          session: abc123
        execution_mode: auto
        headers:
          Accept-Language: en-US,en;q=0.9
        headless: false
        lang: en-US
        max_retries: 2
        navigation_mode: auto
        proxy: http://user:pass@proxy.example:8080
        scroll: true
        url: https://example.com
        user_agent: Mozilla/5.0 (compatible; html2rss)
        wait_for_complete_page_load: true
        wait_for_selector: h1
        wait_timeout_seconds: 15
        window_size:
          height: 1080
          width: 1920
    ScrapeSuccess:
      properties:
        url:
          type: string
          title: Url
          description: Requested scrape URL as submitted.
          examples:
          - https://example.com
        final_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Final Url
          description: Best-effort landing URL after redirects.
          examples:
          - https://example.com/
        status_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Status Code
          description: Best-effort HTTP status of the main document.
          examples:
          - 200
        headers:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Headers
          description: Best-effort response headers. When `html` is present, `content-type`
            is `text/html; charset=utf-8`.
          examples:
          - content-type: text/html; charset=utf-8
        html:
          type: string
          title: Html
          description: Rendered page HTML, UTF-8-normalized. When present, headers
            `content-type` is `text/html; charset=utf-8`.
          examples:
          - <!doctype html><html><body>Example Domain</body></html>
        metadata_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Metadata Error
          description: Metadata extraction failure message. HTML success is still
            returned.
