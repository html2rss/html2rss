    url: https://media.example.net/tide-talk/12.mp3
    type: audio/mpeg
  https://example.com/news/episodes/11-oyster-beds:
    url: https://media.example.net/tide-talk/11.mp3
    type: audio/mpeg
  https://example.com/news/episodes/10-lifeboat-crew:
