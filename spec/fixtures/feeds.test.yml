# Synthetic demonstration config; every URL points at example.com.
---
stylesheets:
  - href: '/style.xls'
    media: 'all'
    type: 'text/xsl'
  - href: '/rss.css'
    media: 'all'
    type: 'text/css'
headers:
  'User-Agent': "html2rss-spec/1.0 (+https://example.com/bot)"
feeds:
  releases_page:
    channel:
      url: https://example.com/example/widget/releases
    selectors:
      items:
        selector: '.release'
      title:
        selector: '.release-header .text-normal a'
        post_process:
          - name: 'template'
            string: '%<self>s (%<author>s)'
      author:
        selector: '.avatar'
        extractor: 'attribute'
        attribute: 'alt'
        post_process:
          - name: substring
            start: 1
          - name: substring
            start: 0
            end: -2
      url:
        selector: '.release-header .text-normal a'
        extractor: 'href'
      description:
        selector: '.markdown-body'
        extractor: 'html'
      published_at:
        selector: 'relative-time'
        extractor: 'attribute'
        attribute: 'datetime'
        post_process:
          - name: 'parse_time'
      version:
        selector: '.v-align-top .css-truncate-target'
      categories:
        - author
        - version
      enclosure:
        selector: 'img.avatar'
        extractor: 'attribute'
        attribute: 'src'
      guid:
        - url
  json:
    headers:
      Accept: application/json
    channel:
      title: JSON
      url: https://example.com/api/surveys
      ttl: 600
    selectors:
      items:
        selector: 'new > array > object, recent > array > object'
      title:
        selector: 'title'
        post_process:
          - name: 'template'
            string: '%<self>s (%<grade>s) [Rated %<mpaa_rating>s] (%<year>s)'
      grade:
        selector: 'grade'
      movie_title:
        selector: 'movie_title'
      url:
        post_process:
          - name: 'template'
            string: 'https://example.com/search/movie/%<movie_title>s/results'
      mpaa_rating:
        selector: 'mpaa_rating'
      distributor:
        selector: 'distributor'
      year:
        selector: 'year'
      categories:
        - mpaa_rating
        - grade
        - year
      description:
        post_process:
          - name: template
            string: |
              # %<movie_title>s

              MPAA rating: %<mpaa_rating>s
          - name: markdown_to_html
  notitle:
    headers:
      Content-Language: en
    stylesheets:
      - href: '/special.css'
        type: 'text/css'
    channel:
      url: https://example.com/daily/reading?sign=10
      language: en
    selectors:
      items:
        selector: "div.daily-reading"
      description:
        selector: "p"
      url:
        selector: "#reading-today"
        extractor: "href"
  withparams:
    channel:
      url: https://example.com/daily/reading?sign=%<sign>s
      description: "The value of param is: %<param>s"
    selectors:
      items:
        selector: "div.daily-reading"
      description:
        selector: "p"
