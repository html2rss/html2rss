name: lint and test

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PROP_SEED: "20260101"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]
    name: Ruby ${{ matrix.ruby-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run tests
        run: make test
        env:
          COVERAGE: true
  # MCP hosts and cron often spawn Ruby without a locale (default_external US-ASCII);
  # the library must not depend on the process locale.
  test-no-locale:
    runs-on: ubuntu-latest
    name: Ruby 4.0 (no locale)
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run tests without a locale
        run: |
          ruby -e 'abort "locale is not US-ASCII" unless Encoding.default_external == Encoding::US_ASCII'
          bundle exec rspec
        env:
          LANG: C
          LC_ALL: C
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run linting
        run: make lint
      - name: Generate config schema
        run: bundle exec rake config:schema
      - name: Ensure config schema is committed
        run: git diff --exit-code schema/html2rss-config.schema.json
      - name: Validate fixture configs
        run: |
          bundle exec exe/html2rss validate spec/fixtures/single.test.yml
          bundle exec exe/html2rss validate spec/fixtures/feeds.test.yml notitle
          ! bundle exec exe/html2rss validate spec/fixtures/invalid_selectors.test.yml
  yard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: gem install redcarpet
      - name: Run YARD lint
        run: make lint-yard
      - name: Generate documentation
        run: make docs
      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/
