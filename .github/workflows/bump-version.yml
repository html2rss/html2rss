name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version to set (X.Y.Z, for example 1.4.0). Relative bumps are not accepted."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump_version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: master

      - name: Assert master branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "Error: This workflow must be run against the master branch (refs/heads/master); got ${{ github.ref }}" >&2
            exit 1
          fi

      - name: Require explicit version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION#v}"
          version="${version#"${version%%[![:space:]]*}"}"
          version="${version%"${version##*[![:space:]]}"}"
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Error: version must be an explicit semver X.Y.Z." >&2
            exit 1
          fi
          echo "TARGET_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Perform Version Bump
        id: perform_bump
        env:
          BUNDLE_FROZEN: "false"
        run: |
          bundle exec ruby bin/bump-version "$TARGET_VERSION"
          bundle install
          NEW_VERSION=$(ruby -I. -e "require 'lib/html2rss/version'; puts Html2rss::VERSION")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Regenerate config schema
        run: bundle exec rake config:schema

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BUMP_VERSION_TOKEN || github.token }}
          commit-message: "chore(release): bump version to v${{ steps.perform_bump.outputs.new_version }}"
          branch: "release/v${{ steps.perform_bump.outputs.new_version }}"
          title: "chore(release): bump version to v${{ steps.perform_bump.outputs.new_version }}"
          body: |
            Automated version bump to `v${{ steps.perform_bump.outputs.new_version }}`.

            This PR contains the version update in `lib/html2rss/version.rb` and regenerated schema.

            ### 🚀 Next Steps
            1. Verify that all CI checks pass.
            2. Merge this Pull Request.
            3. Go to the draft release on GitHub and publish it.
          assignees: ${{ github.actor }}
          base: master
          delete-branch: true
