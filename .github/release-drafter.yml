name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
target-branch: master
autolabeler:
  - label: 'enhancement'
    title:
      - '/^feat(\([^)]+\))?!?:/i'
  - label: 'bug'
    title:
      - '/^fix(\([^)]+\))?!?:/i'
  - label: 'chore'
    title:
      - '/^(chore|test|refactor|docs|ci|build|deps)(\([^)]+\))?!?:/i'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
      - 'bugfix'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'documentation'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  ---
  <!-- Release Instructions:
  1. Dispatch the Bump Version workflow on `master` with `version` set to an explicit semver (`X.Y.Z`).
  2. Review and merge the resulting version bump pull request.
  3. Publish this draft release on GitHub. The Release Gem workflow builds and publishes the gem to RubyGems.
  -->
